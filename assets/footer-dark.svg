<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="VIBHAV">
  <defs>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="260" rx="24"/></clipPath>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <radialGradient id="orange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7790f" stop-opacity="0.35"/><stop offset="70%" stop-color="#f7790f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peri" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6c8eff" stop-opacity="0.30"/><stop offset="70%" stop-color="#6c8eff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.7" fill="#f5f5f7"/>
    </pattern>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="#0e0e10"/>
    <g filter="url(#soft)">
      <g><animateTransform attributeName="transform" type="translate" additive="sum" dur="14s" values="0 0; 40 20; 0 0" repeatCount="indefinite"/>
        <circle cx="220" cy="220" r="170" fill="url(#orange)"/></g>
      <g><animateTransform attributeName="transform" type="translate" additive="sum" dur="17s" values="0 0; -36 -18; 0 0" repeatCount="indefinite"/>
        <circle cx="980" cy="60" r="190" fill="url(#peri)"/></g>
    </g>
    <text x="600" y="158" text-anchor="middle" font-family="'Arial Black', 'Segoe UI', Ubuntu, sans-serif" font-size="118" font-weight="900" letter-spacing="6" fill="url(#dots)">VIBHAV</text>
    <text x="600" y="216" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="3" fill="#8a8a92">2026 &#183; VIBHAV YADAV &#183; VIBHAVY.DEV</text>
  </g>
</svg>