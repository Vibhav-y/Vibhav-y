<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Vibhav Yadav">
  <defs>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="320" rx="24"/></clipPath>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <radialGradient id="orange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7790f" stop-opacity="0.60"/><stop offset="70%" stop-color="#f7790f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peri" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6c8eff" stop-opacity="0.55"/><stop offset="70%" stop-color="#6c8eff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.45"/><stop offset="70%" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.45"/><stop offset="70%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="#0e0e10"/>
    <g filter="url(#soft)">
      <g><animateTransform attributeName="transform" type="translate" additive="sum" dur="13s" values="0 0; 46 28; 0 0" repeatCount="indefinite"/>
        <circle cx="180" cy="90" r="190" fill="url(#orange)"/></g>
      <g><animateTransform attributeName="transform" type="translate" additive="sum" dur="16s" values="0 0; -40 34; 0 0" repeatCount="indefinite"/>
        <circle cx="1010" cy="70" r="210" fill="url(#peri)"/></g>
      <g><animateTransform attributeName="transform" type="translate" additive="sum" dur="18s" values="0 0; -30 -26; 0 0" repeatCount="indefinite"/>
        <circle cx="1080" cy="290" r="180" fill="url(#mint)"/></g>
      <g><animateTransform attributeName="transform" type="translate" additive="sum" dur="15s" values="0 0; 38 -22; 0 0" repeatCount="indefinite"/>
        <circle cx="470" cy="320" r="170" fill="url(#amber)"/></g>
    </g>
    <text x="80" y="150" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#f5f5f7">Vibhav Yadav</text>
    <text x="82" y="196" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="0.2" fill="#b4b4bd">Full-stack developer</text>
    <rect x="83" y="222" width="46" height="3" rx="1.5" fill="#f7790f"/>
    <text x="82" y="255" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="500" letter-spacing="0.3" fill="#8a8a92">Realtime systems  ·  clean APIs  ·  interfaces that feel fast</text>
  </g>
</svg>